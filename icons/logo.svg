<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Gradient for the main tabs -->
    <linearGradient id="tabGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>

    <!-- Gradient for the secondary tab -->
    <linearGradient id="tabGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>

    <!-- Arrow gradient -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#f8fafc" filter="url(#shadow)"/>

  <!-- Left browser window (source) -->
  <g transform="translate(14, 28)">
    <!-- Window frame -->
    <rect x="0" y="0" width="44" height="56" rx="4" fill="url(#tabGradient)" filter="url(#shadow)"/>

    <!-- Tab bar -->
    <rect x="2" y="2" width="40" height="10" rx="2" fill="#4f46e5"/>

    <!-- Tab 1 (active) -->
    <rect x="4" y="4" width="14" height="7" rx="1.5" fill="#ffffff"/>

    <!-- Tab 2 -->
    <rect x="20" y="4" width="10" height="7" rx="1.5" fill="#6366f1" opacity="0.6"/>

    <!-- Tab 3 -->
    <rect x="32" y="4" width="8" height="7" rx="1.5" fill="#6366f1" opacity="0.6"/>

    <!-- Content area -->
    <rect x="4" y="14" width="36" height="38" rx="2" fill="#ffffff"/>

    <!-- Content lines -->
    <rect x="7" y="18" width="20" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="7" y="24" width="30" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="7" y="30" width="25" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="7" y="38" width="18" height="8" rx="1" fill="#c7d2fe"/>
  </g>

  <!-- Right browser window (destination) -->
  <g transform="translate(70, 28)">
    <!-- Window frame -->
    <rect x="0" y="0" width="44" height="56" rx="4" fill="url(#tabGradient2)" filter="url(#shadow)"/>

    <!-- Tab bar -->
    <rect x="2" y="2" width="40" height="10" rx="2" fill="#0891b2"/>

    <!-- Tab 1 (active) -->
    <rect x="4" y="4" width="14" height="7" rx="1.5" fill="#ffffff"/>

    <!-- Tab 2 -->
    <rect x="20" y="4" width="10" height="7" rx="1.5" fill="#06b6d4" opacity="0.6"/>

    <!-- Content area -->
    <rect x="4" y="14" width="36" height="38" rx="2" fill="#ffffff"/>

    <!-- Content lines -->
    <rect x="7" y="18" width="20" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="7" y="24" width="30" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="7" y="30" width="25" height="3" rx="1" fill="#e2e8f0"/>
    <rect x="7" y="38" width="18" height="8" rx="1" fill="#a5f3fc"/>
  </g>

  <!-- Migration arrows in center -->
  <g transform="translate(64, 64)">
    <!-- Arrow right (top) -->
    <path d="M-6,-8 L6,-8 L6,-12 L14,-4 L6,4 L6,0 L-6,0 Z"
          fill="url(#arrowGradient)"
          filter="url(#shadow)"/>

    <!-- Arrow left (bottom) -->
    <path d="M6,8 L-6,8 L-6,12 L-14,4 L-6,-4 L-6,0 L6,0 Z"
          fill="url(#arrowGradient)"
          filter="url(#shadow)"/>
  </g>

  <!-- Small floating tab being transferred -->
  <g transform="translate(58, 95)">
    <rect x="0" y="0" width="12" height="16" rx="2" fill="#fbbf24" filter="url(#shadow)"/>
    <rect x="1" y="1" width="10" height="4" rx="1" fill="#f59e0b"/>
    <rect x="2" y="6" width="8" height="8" rx="1" fill="#ffffff"/>
  </g>
</svg>
